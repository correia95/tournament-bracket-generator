    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Tournament Bracket Generator",
        "url": "https://tournament-bracket-generator.correia95.workers.dev/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Generates a single-elimination tournament bracket from a list of names, seeding pairs from opposite ends of the field and auto-advancing byes when the field isn't a power of two, with click-to-advance winners and a shareable link."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What happens with an odd number of participants?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The bracket size rounds up to the next power of two, and the extra slots become byes - automatic advances for the participants without an opponent in round 1."
            }
          },
          {
            "@type": "Question",
            "name": "Can I change a pick after making it?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes - click the other name in that match. Any picks in later rounds that depended on it are cleared automatically so the bracket never shows an inconsistent state."
            }
          },
          {
            "@type": "Question",
            "name": "Does the share link update live for people I send it to?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No - it's a snapshot of the bracket and picks at the moment you copy it. Copy a new link after making more picks."
            }
          }
        ]
      }
    </script>
